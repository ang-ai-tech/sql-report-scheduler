[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reportsched"
version = "0.1.0"
description = "Open-source report scheduler: SQL query -> Excel template -> e-mail, on a schedule."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "apscheduler>=3.11,<4",
    "pyyaml>=6.0",
    "tzdata",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.5"]
# Database drivers, only for the databases you use (SQLite needs nothing)
postgres = ["psycopg[binary]>=3.2"]
sqlserver = ["pyodbc>=5.1"]
duckdb = ["duckdb-engine>=0.13"]

[project.scripts]
reports = "reportsched.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
